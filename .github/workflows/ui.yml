name: Desktop packages

on:
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      - name: Build AppImage and Windows ZIP
        run: go run ./tools/package -version "${GITHUB_REF_NAME#v}"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: anygame-desktop
          path: |
            dist/*.AppImage
            dist/*.zip
          if-no-files-found: error
