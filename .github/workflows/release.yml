name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Build desktop packages
        run: go run ./tools/package -version "${GITHUB_REF_NAME#v}"

      - name: Checksums
        run: sha256sum dist/*.AppImage dist/*.zip | tee dist/SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          body_path: docs/releases/${{ github.ref_name }}.md
          files: |
            dist/*.AppImage
            dist/*.zip
            dist/SHA256SUMS
          generate_release_notes: false
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
